# Services definition override for CI/CD

services:

  docs-volumes:
    # Build
    image: matiboux/chown-volumes:latest
    # Deploy
    environment:
      UID: ${DOCKER_UID:-${UID:-1000}}
      VOLUMES: |
        /dist
    volumes:
      - ./docs/dist:/dist

  docs:
    # Extend
    extends:
      file: ./docker-compose-docs.yml
      service: docs
    # Build override
    image: ${IMAGES_PREFIX:-app}-docs-cicd:${IMAGES_TAG:-latest}
    build:
      target: source_prod
      args:
        UID: ${DOCKER_UID:-${UID:-1000}}
        BUILD_CHECK: ${BUILD_CHECK:-false}
    # Deploy override
    depends_on:
      docs-volumes:
        condition: service_completed_successfully
    user: ${DOCKER_UID:-${UID:-1000}}
    environment: !reset null
    command: [ 'sh', '-c', 'rm -rf /dist/* && cp -r /app/dist/* /dist' ]
    volumes:
      - ./docs/dist:/dist
