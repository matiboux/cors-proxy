# Services definition for building & deploying

name: cors-proxy-docs

services:

  docs:
    # Extend
    extends:
      file: ./docs/docker-compose.yml
      service: docs
    # Build override
    image: ${IMAGES_PREFIX:-app}-docs:${IMAGES_TAG:-latest}
    # Deploy override
    ports: !override
      - ${DOCS_PORT:-8080}:${DOCS_DOCKER_PORT:-8080}  # HTTP
